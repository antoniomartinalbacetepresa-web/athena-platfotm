name: Validate ATHENA TYCHE

on:
  push:
    branches:
      - dev/real-market-backend
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: backend/pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  flutter-validation:
    name: Flutter analyze, tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee flutter-analyze.log

      - name: Test
        if: always()
        run: |
          set -o pipefail
          flutter test 2>&1 | tee flutter-test.log

      - name: Browser cross-surface acceptance (Chrome)
        run: |
          set -o pipefail
          flutter test --platform chrome \
            test/features/dashboard/dashboard_athena_synthesis_wiring_test.dart \
            test/features/market/market_page_integration_test.dart \
            test/features/news/news_page_full_feed_acceptance_test.dart \
            test/features/dashboard/relevant_investors_panel_test.dart \
            test/features/portfolio/dashboard_portfolio_cross_surface_e2e_test.dart \
            test/features/profile/profile_page_test.dart \
            test/features/profile/profile_personalization_shell_test.dart \
            test/features/profile/profile_session_transition_e2e_test.dart \
            test/features/portfolio/profile_portfolio_logout_cross_surface_e2e_test.dart \
            test/features/portfolio/authenticated_portfolio_page_e2e_test.dart \
            2>&1 | tee flutter-chrome-acceptance.log

      - name: Build release web bundle
        if: success()
        run: flutter build web --release

      - name: Upload Flutter validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: |
            app/flutter-analyze.log
            app/flutter-test.log
            app/flutter-chrome-acceptance.log
            app/pubspec.lock
          if-no-files-found: warn
          retention-days: 7

      - name: Upload release web bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: athena-web-release
          path: app/build/web
          if-no-files-found: error
          retention-days: 7

  deployed-api-acceptance:
    name: Deployed cross-surface API and two-owner isolation (opt-in)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/real-market-backend' && vars.ATHENA_DEPLOYED_ACCEPTANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-acceptance
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP client
        run: python -m pip install httpx==0.28.1

      - name: Require independently attested deployed SHA
        env:
          DEPLOYED_SHA: ${{ vars.ATHENA_ACCEPTANCE_DEPLOYED_SHA }}
        run: |
          test -n "$DEPLOYED_SHA"
          test "$DEPLOYED_SHA" = "$GITHUB_SHA"

      - name: Verify deployed canonical bindings, owner isolation and revocation
        env:
          ATHENA_ACCEPTANCE_BASE_URL: ${{ secrets.ATHENA_ACCEPTANCE_BASE_URL }}
          ATHENA_ACCEPTANCE_A_EMAIL: ${{ secrets.ATHENA_ACCEPTANCE_A_EMAIL }}
          ATHENA_ACCEPTANCE_A_PASSWORD: ${{ secrets.ATHENA_ACCEPTANCE_A_PASSWORD }}
          ATHENA_ACCEPTANCE_A_POSITION_ID: ${{ vars.ATHENA_ACCEPTANCE_A_POSITION_ID }}
          ATHENA_ACCEPTANCE_A_CURRENCY: ${{ vars.ATHENA_ACCEPTANCE_A_CURRENCY }}
          ATHENA_ACCEPTANCE_B_EMAIL: ${{ secrets.ATHENA_ACCEPTANCE_B_EMAIL }}
          ATHENA_ACCEPTANCE_B_PASSWORD: ${{ secrets.ATHENA_ACCEPTANCE_B_PASSWORD }}
          ATHENA_ACCEPTANCE_B_POSITION_ID: ${{ vars.ATHENA_ACCEPTANCE_B_POSITION_ID }}
          ATHENA_ACCEPTANCE_B_CURRENCY: ${{ vars.ATHENA_ACCEPTANCE_B_CURRENCY }}
        run: python backend/scripts/deployed_cross_surface_acceptance.py

  release-validation-gate:
    name: Release validation gate
    if: always()
    needs:
      - backend-tests
      - flutter-validation
      - deployed-api-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require backend, Flutter and release-build validation
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FLUTTER_RESULT: ${{ needs.flutter-validation.result }}
          DEPLOYED_RESULT: ${{ needs.deployed-api-acceptance.result }}
          DEPLOYED_ENABLED: ${{ vars.ATHENA_DEPLOYED_ACCEPTANCE_ENABLED }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FLUTTER_RESULT" = "success"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DEPLOYED_ENABLED" = "true" ]; then
            test "$DEPLOYED_RESULT" = "success"
          fi
